<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>4h MACD Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MACD Scan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,0.10);--blue:#2a78d6;--orange:#eb6834;--good:#0ca30c;--good-text:#006300;--crit:#d03b3b;--warn:#fab219;--gold:#d99a00}
:root[data-theme="dark"]{color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#4a4a46;--ring:rgba(255,255,255,0.11);--blue:#3987e5;--orange:#e0763f;--good:#20c020;--good-text:#4fd24f;--crit:#e34948;--warn:#fab219;--gold:#f0b93a}
@media (prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#4a4a46;--ring:rgba(255,255,255,0.11);--blue:#3987e5;--orange:#e0763f;--good:#20c020;--good-text:#4fd24f;--crit:#e34948;--warn:#fab219;--gold:#f0b93a}}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding:16px 16px 60px;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto}.num{font-variant-numeric:tabular-nums}
.sub{color:var(--ink2);font-size:13px;max-width:660px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink);border:1px solid var(--ring)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:12px 0 6px}.asof{color:var(--muted);font-size:12px;text-align:right;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 14px}
.tile .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.tile .v{font-size:22px;font-weight:650;letter-spacing:-.01em}
/* sticky top bar */
.topbar{position:sticky;top:8px;z-index:50;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border:1px solid var(--ring);border-radius:14px;padding:9px 12px 9px 14px;margin:0 0 10px;box-shadow:0 4px 20px rgba(0,0,0,.10)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.blogo{flex:none;width:34px;height:34px;border-radius:9px;display:block;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.btit{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.btit b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.btit .bs{font-size:11px;color:var(--muted);font-weight:600}
.tb-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sess{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--ring);border-radius:999px;background:var(--plane);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st-open .sdot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.st-pre .sdot{background:var(--warn)}.st-after .sdot{background:var(--blue)}.st-closed .sdot{background:var(--muted)}
.cd{display:inline-flex;align-items:center;gap:8px;padding:5px 13px;border:1px solid var(--ring);border-radius:999px;background:var(--plane);font-size:12px;color:var(--ink2);white-space:nowrap}
.cd b{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:800;font-size:15px;letter-spacing:.02em}
.iconbtn{flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ring);border-radius:9px;background:var(--plane);color:var(--ink2);cursor:pointer;font-size:15px;line-height:1;padding:0}
.iconbtn:hover{color:var(--ink);border-color:var(--axis)}
.iconbtn.on{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,var(--ring))}
.installbtn{display:none;align-items:center;gap:7px;padding:6px 12px;border:1px solid color-mix(in srgb,var(--blue) 50%,var(--ring));border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-size:12px;font-weight:700;cursor:pointer}
.installbtn.show{display:inline-flex}
.clockline{font-size:12px;color:var(--muted);margin:0 0 8px}.clockline #sc-clock{font-weight:600;color:var(--ink2)}
/* collapsible explainer */
.explain{margin:10px 0 4px;border:1px solid var(--ring);border-radius:12px;background:var(--surface);overflow:hidden}
.explain summary{cursor:pointer;padding:11px 15px;font-size:13px;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between}
.explain summary::-webkit-details-marker{display:none}.explain summary::after{content:'▾';color:var(--muted)}
.explain[open] summary::after{content:'▴'}
.explain #sc-explain{padding:0 15px 14px;font-size:12.5px;color:var(--ink2);line-height:1.55}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin:16px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--ring);background:var(--surface);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.chip.star.on{background:var(--gold);border-color:var(--gold);color:#1a1a19}
.tgl{font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.search,.sel{font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:9px;padding:7px 11px;font-family:inherit}
.search{width:150px}.search::placeholder{color:var(--muted)}
.sel{cursor:pointer}
.spacer{flex:1 1 auto}
.tbtn{font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface);border:1px solid var(--ring);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{color:var(--ink);border-color:var(--axis)}
/* table (grid rows) */
.thead{display:grid;grid-template-columns:minmax(160px,1.7fr) 92px 118px 84px minmax(120px,1fr) 96px 54px;gap:10px;align-items:center;padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--grid)}
.thead .r{text-align:right}.ths{cursor:pointer;user-select:none}.ths:hover{color:var(--ink2)}.ar{margin-left:3px;font-size:9px}
.sech{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.sech .cnt{color:var(--muted);font-weight:600}
.dots{width:8px;height:8px;border-radius:50%}.d0{background:var(--good)}.d1{background:var(--blue)}.d2{background:var(--orange)}
.rw{border-bottom:1px solid var(--grid)}
.row{display:grid;grid-template-columns:minmax(160px,1.7fr) 92px 118px 84px minmax(120px,1fr) 96px 54px;gap:10px;align-items:center;padding:11px 14px;color:var(--ink);cursor:pointer;transition:background .1s;position:relative}
.row:hover{background:color-mix(in srgb,var(--blue) 7%,transparent)}
.rw.fade .row{opacity:.5}
.rw.isnew .row{background:color-mix(in srgb,var(--good) 7%,transparent)}
.rw.isnew .row:hover{background:color-mix(in srgb,var(--good) 13%,transparent)}
.rw.open .row{background:color-mix(in srgb,var(--blue) 9%,transparent)}
.c-tk{display:flex;align-items:center;gap:9px;min-width:0}
.starbtn{flex:none;border:none;background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--axis);padding:2px;margin:-2px -2px -2px -4px}
.starbtn.on{color:var(--gold)}
.mono{flex:none;width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.02em}
.tkw{min-width:0}.sym{font-size:14px;font-weight:700}
.new{font-size:9px;font-weight:800;color:var(--good-text);background:color-mix(in srgb,var(--good) 22%,transparent);padding:1px 5px;border-radius:5px;margin-left:6px;letter-spacing:.03em}
.fadeb{font-size:9px;font-weight:700;color:var(--crit);background:color-mix(in srgb,var(--crit) 15%,transparent);padding:1px 5px;border-radius:5px;margin-left:6px}
.nm{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ixp{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin:1px 3px 1px 0}
.ix-sp{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.ix-ndx{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.ix-dow{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.crp{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.cr0{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.cr1{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.cr2{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.crd{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.c-sp{display:flex;flex-direction:column;gap:2px}.spk{width:68px;height:24px;display:block}
.macdv{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-st{min-width:0}.str{display:flex;flex-direction:column;gap:3px}
.strv{font-size:12.5px;font-weight:700;color:var(--good-text);font-variant-numeric:tabular-nums}
.scorev{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.strbar{display:block;height:5px;border-radius:3px;background:var(--grid);overflow:hidden;max-width:120px}
.strbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.erb{font-size:9px;font-weight:800;color:#7a5200;background:color-mix(in srgb,var(--warn) 40%,transparent);padding:1px 5px;border-radius:5px;margin-left:6px;white-space:nowrap}
:root[data-theme="dark"] .erb{color:#ffd980}@media (prefers-color-scheme:dark){:root:not([data-theme]) .erb{color:#ffd980}}
.qwrap{margin-top:12px;border-top:1px solid var(--grid);padding-top:10px}
.qcap{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:7px;display:flex;justify-content:space-between;align-items:baseline}
.qnote{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:10px}
.qrow{display:grid;grid-template-columns:92px 1fr 54px;gap:8px;align-items:center;margin:5px 0}
.ql{font-size:11px;color:var(--ink2);font-weight:600}
.qb{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.qb i{display:block;height:100%;background:var(--blue);border-radius:3px}
.qval{font-size:11px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.qmeta{font-size:11px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}
.pos{color:var(--good-text);font-weight:700}.neg{color:var(--crit);font-weight:700}
#sc-starred{padding:2px 15px 14px}
.sthead,.strow{display:grid;grid-template-columns:64px 1fr 70px 70px 74px 22px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.sthead{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:2px 0 6px;border-bottom:1px solid var(--grid)}
.sthead span:nth-child(n+3),.strow span:nth-child(n+3){text-align:right}
.strow{padding:8px 0;border-bottom:1px solid var(--grid);font-size:13px}
.strow .stk{font-weight:800}.strow .sdt{font-size:11px;color:var(--muted);text-align:left}
.stx{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px;text-align:center}
.stx:hover{color:var(--crit)}
.stavg{margin-top:10px;font-size:13px;color:var(--ink2)}
.stnote{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.5}
.sincev{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.sincev.up{color:var(--good-text)}.sincev.down{color:var(--crit)}
.c-px{text-align:right}.last{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chg{display:block;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}.chg.up{color:var(--good-text)}.chg.down{color:var(--crit)}
.c-vol{text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* drawer */
.drawer{padding:0 14px;max-height:0;overflow:hidden;transition:max-height .28s ease,padding .28s ease}
.rw.open .drawer{max-height:640px;padding:4px 14px 18px}
.dgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
.dcard{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 14px}
.dcap{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.leg{display:flex;gap:10px;font-size:10px;font-weight:600}
.leg span{display:inline-flex;align-items:center;gap:4px;color:var(--ink2)}
.leg i{width:9px;height:2.5px;border-radius:2px;display:inline-block}
.mchart{width:100%;height:96px;display:block}
.pchart{width:100%;height:40px;display:block;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv .k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.kv .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.dact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;text-decoration:none;padding:8px 14px;border-radius:9px;border:1px solid var(--ring);color:var(--ink)}
.dbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sectag{display:inline-block;font-size:10px;font-weight:700;color:var(--ink2);background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid var(--ring);padding:2px 7px;border-radius:5px}
.dropped{margin:22px 0 4px;padding:13px 15px;border:1px dashed var(--ring);border-radius:12px;background:var(--surface)}
.dropped .dh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:8px}
.dchip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink2);background:color-mix(in srgb,var(--ink) 6%,transparent);border:1px solid var(--ring);padding:3px 8px;border-radius:6px;margin:0 5px 5px 0;text-decoration:none}
.dchip:hover{color:var(--ink);border-color:var(--axis)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:11.5px;margin-top:24px;line-height:1.6}
/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;background:var(--ink);color:var(--plane);font-size:13px;font-weight:600;padding:11px 18px;border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:opacity .25s,transform .25s;z-index:100;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
@media (max-width:680px){
  body{padding:12px 10px 50px}
  .thead{display:none}
  #sc-results .sech:first-child{margin-top:10px}
  .rw{border:1px solid var(--ring);border-radius:13px;margin:9px 0;background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.05);overflow:hidden}
  .row{grid-template-columns:1fr 1fr;gap:9px 12px;padding:13px 14px}
  .row:hover{background:transparent}
  .c-tk{grid-column:1/3}.c-ix{grid-column:1/3;margin-top:-2px}
  .c-cr{order:5}.c-sp{order:6;align-items:flex-end}.c-st{order:7}.c-px{order:8;text-align:right}.c-vol{order:9;text-align:left;align-self:end}
  .strbar{max-width:none}
  .c-vol::before{content:'avg vol ';color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
  .dgrid{grid-template-columns:1fr}
  .search{width:100%}.controls .search{order:-1;flex:1 1 100%}
}
</style></head><body><div class="wrap">
<div class="topbar">
  <div class="brand"><img class="blogo" src="icon-192.png" alt=""><span class="btit"><b>MACD Scanner</b><span class="bs">4-hour bullish crosses</span></span></div>
  <div class="tb-r">
    <span class="sess" id="sc-sess"><span class="sdot"></span><span id="sc-sesslab">—</span></span>
    <span class="cd">Next candle <b id="sc-countdown">—:—:—</b></span>
    <button class="installbtn" id="sc-install" title="Install this app">⤓ Install</button>
    <button class="iconbtn" id="sc-bell" title="New-cross sound">🔕</button>
    <button class="iconbtn" id="sc-theme" title="Theme">◐</button>
  </div>
</div>
<div class="clockline">🕒 <span id="sc-clock">—</span> · updates on its own after each candle</div>
<div class="rhead"><div><div class="sub" id="sc-sub"></div></div><div style="text-align:right"><span class="badge" id="sc-badge">● Live scan</span><div class="asof" id="sc-asof"></div></div></div>
<div class="tiles" id="sc-tiles"></div>
<details class="explain"><summary>How to read this</summary><div id="sc-explain"></div></details>
<details class="explain" id="sc-starwrap" style="display:none"><summary id="sc-starsum">★ Your starred watchlist</summary><div id="sc-starred"></div></details>
<div class="controls" id="sc-controls"></div>
<div id="sc-results"></div>
<div id="sc-dropped"></div>
<div class="foot" id="sc-foot"></div>
</div>

(function(){var deferred=null,btn=document.getElementById('sc-install');
 var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;if(!standalone)btn.classList.add('show');});
 window.addEventListener('appinstalled',function(){btn.classList.remove('show');toast('Installed — find it on your home screen');});
 var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(isIOS&&!standalone)btn.classList.add('show');
 btn.onclick=function(){if(deferred){deferred.prompt();deferred.userChoice.then(function(){deferred=null;btn.classList.remove('show');});}
   else if(isIOS){toast('To install: tap the Share button, then “Add to Home Screen”.');}
   else{toast('Open your browser menu and choose “Install app”.');}};
})();
/* ---- clock, session, countdown, auto-update ---- */
(function(){
 function _p(n){return String(n).padStart(2,'0');}
 var F=4*3600*1000;
 function etParts(){var p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());var o={};p.forEach(function(x){o[x.type]=x.value;});return o;}
 function session(){var p=etParts();var wd=p.weekday;var hh=parseInt(p.hour,10)%24,mm=parseInt(p.minute,10);var t=hh*60+mm;
   if(wd==='Sat'||wd==='Sun')return{l:'Weekend · closed',c:'st-closed'};
   if(t>=240&&t<570)return{l:'Pre-market',c:'st-pre'};
   if(t>=570&&t<960)return{l:'Market open',c:'st-open'};
   if(t>=960&&t<1200)return{l:'After hours',c:'st-after'};
   return{l:'Closed',c:'st-closed'};}
 function tick(){var now=new Date();var c=document.getElementById('sc-clock');
   if(c)c.textContent=now.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})+' ET';
   var se=session(),el=document.getElementById('sc-sess'),lb=document.getElementById('sc-sesslab');
   if(el){el.className='sess '+se.c;}if(lb){lb.textContent=se.l;}
   var ms=now.getTime(),nxt=Math.ceil((ms+1)/F)*F,d=Math.max(0,Math.round((nxt-ms)/1000)),h=Math.floor(d/3600);d-=h*3600;var mm2=Math.floor(d/60),s=d-mm2*60;
   var cd=document.getElementById('sc-countdown');if(cd)cd.textContent=_p(h)+':'+_p(mm2)+':'+_p(s);}
 setInterval(tick,1000);tick();
 var target=Math.ceil((Date.now()+1)/F)*F;
 setInterval(function(){var now=Date.now();if(now<target)return;
   fetch('build.json?t='+now,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(b){
     if(b&&b.ts&&b.ts>BUILD_TS){location.reload();}
     else if(now>target+25*60*1000){target=Math.ceil((Date.now()+1)/F)*F;}
   }).catch(function(){});
 },15000);
})();
/* ---- register service worker ---- */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script></body></html>
