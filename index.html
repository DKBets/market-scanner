<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>4h MACD Scanner</title>
<style>
:root{color-scheme:light;--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,0.10);--blue:#2a78d6;--orange:#eb6834;--good:#0ca30c;--good-text:#006300;--crit:#d03b3b;--warn:#fab219}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#4a4a46;--ring:rgba(255,255,255,0.11);--blue:#3987e5;--orange:#e0763f;--good:#20c020;--good-text:#4fd24f;--crit:#e34948;--warn:#fab219}}
*{box-sizing:border-box}body{margin:0;background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding:20px 16px 60px}
.wrap{max-width:1000px;margin:0 auto}.num{font-variant-numeric:tabular-nums}
.sub{color:var(--ink2);font-size:13px;max-width:660px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink);border:1px solid var(--ring)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:12px 0 6px}.asof{color:var(--muted);font-size:12px;text-align:right;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:12px 14px}
.tile .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.tile .v{font-size:22px;font-weight:650;letter-spacing:-.01em}
/* sticky top bar */
.topbar{position:sticky;top:8px;z-index:50;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:10px 16px;margin:0 0 10px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.topbar .tb-l{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--ink)}
.topbar .dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar .cd{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid var(--ring);border-radius:999px;background:var(--plane);font-size:13px;color:var(--ink2);white-space:nowrap}
.topbar .cd b{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:800;font-size:17px;letter-spacing:.02em}
.clockline{font-size:12px;color:var(--muted);margin:0 0 8px}.clockline #sc-clock{font-weight:600;color:var(--ink2)}
/* collapsible explainer */
.explain{margin:10px 0 4px;border:1px solid var(--ring);border-radius:12px;background:var(--surface);overflow:hidden}
.explain summary{cursor:pointer;padding:11px 15px;font-size:13px;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between}
.explain summary::-webkit-details-marker{display:none}.explain summary::after{content:'▾';color:var(--muted)}
.explain[open] summary::after{content:'▴'}
.explain #sc-explain{padding:0 15px 14px;font-size:12.5px;color:var(--ink2);line-height:1.55}
/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:16px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--ring);background:var(--surface);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.tgl{font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
/* table (grid rows) */
.thead,.row{display:grid;grid-template-columns:minmax(150px,1.7fr) 92px 118px 84px minmax(104px,1fr) 92px 56px;gap:10px;align-items:center}
.thead{padding:6px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--grid)}
.thead .r{text-align:right}.ths{cursor:pointer;user-select:none}.ths:hover{color:var(--ink2)}.ar{margin-left:3px;font-size:9px}
.sech{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.sech .cnt{color:var(--muted);font-weight:600}
.dots{width:8px;height:8px;border-radius:50%}.d0{background:var(--good)}.d1{background:var(--blue)}.d2{background:var(--orange)}
.row{padding:11px 14px;border-bottom:1px solid var(--grid);text-decoration:none;color:var(--ink);transition:background .1s}
.row:hover{background:color-mix(in srgb,var(--blue) 7%,transparent)}
.row.fade{opacity:.48}
.row.isnew{background:color-mix(in srgb,var(--good) 7%,transparent)}
.row.isnew:hover{background:color-mix(in srgb,var(--good) 13%,transparent)}
.c-tk{display:flex;align-items:center;gap:10px;min-width:0}
.mono{flex:none;width:31px;height:31px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:.02em}
.tkw{min-width:0}.sym{font-size:14px;font-weight:700}
.new{font-size:9px;font-weight:800;color:var(--good-text);background:color-mix(in srgb,var(--good) 22%,transparent);padding:1px 5px;border-radius:5px;margin-left:6px;letter-spacing:.03em}
.fadeb{font-size:9px;font-weight:700;color:var(--crit);background:color-mix(in srgb,var(--crit) 15%,transparent);padding:1px 5px;border-radius:5px;margin-left:6px}
.nm{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ixp{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin:1px 3px 1px 0}
.ix-sp{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.ix-ndx{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.ix-dow{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.crp{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.cr0{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.cr1{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.cr2{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.crd{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.c-sp{display:flex;flex-direction:column;gap:2px}.spk{width:68px;height:24px;display:block}
.macdv{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.c-st{min-width:0}.str{display:flex;flex-direction:column;gap:3px}
.strv{font-size:12.5px;font-weight:700;color:var(--good-text);font-variant-numeric:tabular-nums}
.strbar{display:block;height:5px;border-radius:3px;background:var(--grid);overflow:hidden;max-width:120px}
.strbar i{display:block;height:100%;background:var(--good);border-radius:3px}
.c-px{text-align:right}.last{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chg{display:block;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}.chg.up{color:var(--good-text)}.chg.down{color:var(--crit)}
.c-vol{text-align:right;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:11.5px;margin-top:24px;line-height:1.6}
@media (max-width:680px){
  body{padding:14px 10px 50px}
  .thead{display:none}
  #sc-results .sech:first-child{margin-top:10px}
  .row{grid-template-columns:1fr 1fr;gap:9px 12px;padding:13px 14px;border:1px solid var(--ring);border-radius:13px;margin:9px 0;background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.05)}
  .row:hover{background:var(--surface)}
  .c-tk{grid-column:1/3}.c-ix{grid-column:1/3;margin-top:-2px}
  .c-cr{order:5}.c-sp{order:6;align-items:flex-end}.c-st{order:7}.c-px{order:8;text-align:right}.c-vol{order:9;text-align:left;align-self:end}
  .strbar{max-width:none}
  .c-vol::before{content:'avg vol ';color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.03em}
}

function strengthBar(v,mx){var pct=Math.min(100,Math.abs(v)/(mx||1)*100);return '<div class="str"><span class="strv">'+(v>=0?'+':'')+v.toFixed(2)+'</span><span class="strbar"><i style="width:'+pct.toFixed(0)+'%"></i></span></div>';}
function rowHTML(r,mx){var chg=r.chg>=0?'up':'down';var url='https://www.tradingview.com/symbols/'+encodeURIComponent(r.ticker)+'/';
 return '<a class="row'+(r.faded?' fade':'')+(r.is_new?' isnew':'')+'" href="'+url+'" target="_blank" rel="noopener" title="Open '+r.ticker+' chart on TradingView">'
 +'<div class="c-tk">'+mono(r.ticker)+'<div class="tkw"><span class="sym">'+r.ticker+'</span>'+(r.is_new?'<span class="new">NEW</span>':'')+(r.faded?'<span class="fadeb">faded</span>':'')+'<span class="nm">'+(r.name||r.ticker)+'</span></div></div>'
 +'<div class="c-ix">'+idxPills(r.idx)+'</div>'
 +'<div class="c-cr">'+crossPill(r)+'</div>'
 +'<div class="c-sp">'+sparkSVG(r.spark)+'<span class="macdv">MACD '+r.macd.toFixed(2)+'</span></div>'
 +'<div class="c-st">'+strengthBar(r.hist,mx)+'</div>'
 +'<div class="c-px"><span class="last">$'+fmtpx(r.last)+'</span><span class="chg '+chg+'">'+(r.chg>=0?'+':'')+r.chg.toFixed(1)+'%</span></div>'
 +'<div class="c-vol">'+fmtvol(r.avg_vol)+'</div></a>';}
function renderScan(SC){
 var rows=(SC.rows||[]).slice(), m=SC.meta||{};
 document.getElementById('sc-sub').innerHTML='Bullish <b>MACD(12,26,9)</b> cross on <b>4-hour</b> bars while the line is <b>below zero</b> — oversold turning up. Universe: <b>S&amp;P 500 + Nasdaq-100 + Dow</b>, avg volume <b>&ge; 1M</b>/day.';
 var asof=document.getElementById('sc-asof'); if(asof) asof.textContent=m.asOf||'';
 var inSP=rows.filter(function(r){return r.idx.indexOf('SP500')>-1;}).length,inND=rows.filter(function(r){return r.idx.indexOf('NDX')>-1;}).length,inDW=rows.filter(function(r){return r.idx.indexOf('DOW')>-1;}).length,fresh=rows.filter(function(r){return r.bars_ago===0;}).length;
 document.getElementById('sc-tiles').innerHTML=[['Matches',rows.length],['On newest candle',fresh],['In S&P 500',inSP],['In Nasdaq-100',inND],['In Dow',inDW],['Universe',m.scanned]].map(function(t){return '<div class="tile"><div class="t">'+t[0]+'</div><div class="v num">'+(t[1]!=null?t[1]:'—')+'</div></div>';}).join('');
 document.getElementById('sc-explain').innerHTML='Each name below crossed its 4-hour MACD line up through its signal line while still <b>below zero</b> — momentum turning up from an oversold pullback. The <b>Trend</b> sparkline shows the recent histogram (red bars below the line, flipping green as it turns up); <b>Strength</b> is how decisively the lines separated. Freshest crosses are grouped at the top, and <span style="color:var(--good-text);font-weight:700">NEW</span> marks names that appeared since the last scan. The <b>Cross</b> time is when that 4-hour candle <b>closed</b> (ET) — while the market is shut, the newest completed candle is from the prior session, so it can read "hours ago." These regular-hours candles may differ slightly from a charting platform\'s 4H view. <b>This is a watchlist, not a trade — nothing here is bought.</b> A red day-change on a fresh cross can mean it already gapped away. Tap any row to open its chart.';
 var st={idx:'all',hideFaded:false,sortKey:'hist',sortDir:-1};
 var chips=[['all','All'],['SP500','S&P 500'],['NDX','Nasdaq'],['DOW','Dow']];
 document.getElementById('sc-controls').innerHTML='<div class="chips">'+chips.map(function(c){return '<button class="chip'+(c[0]==='all'?' on':'')+'" data-ix="'+c[0]+'">'+c[1]+'</button>';}).join('')+'</div><label class="tgl"><input type="checkbox" id="sc-hf"> Hide faded</label>';
 function passes(r){return (st.idx==='all'||r.idx.indexOf(st.idx)>-1)&&(!st.hideFaded||!r.faded);}
 function ind(k){return st.sortKey===k?'<span class="ar">'+(st.sortDir<0?'▼':'▲')+'</span>':'';}
 function render(){
   var fr=rows.filter(passes),mx=1;rows.forEach(function(r){if(Math.abs(r.hist)>mx)mx=Math.abs(r.hist);});
   var html='<div class="thead"><div>Ticker</div><div>Index</div><div>Cross</div><div>Trend</div>'
     +'<div class="ths" data-k="hist">Strength'+ind('hist')+'</div>'
     +'<div class="ths r" data-k="chg">Price / Day'+ind('chg')+'</div>'
     +'<div class="ths r" data-k="avg_vol">Vol'+ind('avg_vol')+'</div></div>';
   var groups=[[0,'Newest completed candle'],[1,'One candle earlier'],[2,'Two candles earlier']],any=false;
   groups.forEach(function(g){
     var gr=fr.filter(function(r){return r.bars_ago===g[0];});
     if(!gr.length)return; any=true;
     gr.sort(function(a,b){return (a[st.sortKey]-b[st.sortKey])*st.sortDir;});
     html+='<div class="sech"><span class="dots d'+g[0]+'"></span>'+g[1]+' <span class="cnt">'+gr.length+'</span></div>';
     html+=gr.map(function(r){return rowHTML(r,mx);}).join('');
   });
   if(!any)html+='<div class="empty">No matches with these filters.</div>';
   document.getElementById('sc-results').innerHTML=html;
   Array.prototype.forEach.call(document.querySelectorAll('.ths'),function(el){el.onclick=function(){var k=el.dataset.k;if(st.sortKey===k)st.sortDir*=-1;else{st.sortKey=k;st.sortDir=-1;}render();};});
 }
 Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(el){el.onclick=function(){st.idx=el.dataset.ix;Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(x){x.classList.remove('on');});el.classList.add('on');render();};});
 document.getElementById('sc-hf').onchange=function(e){st.hideFaded=e.target.checked;render();};
 render();
 document.getElementById('sc-foot').innerHTML='Signal: MACD(12,26,9) on 4h bars, bullish cross with MACD &lt; 0, within the last 3 candles. Data: Yahoo Finance. Filter: avg daily volume ≥ 1,000,000. Universe: current S&amp;P 500 + Nasdaq-100 + Dow ('+(m.universe||'')+' names). Watchlist only — no orders are placed. Re-scans after each 4h candle.';
}
renderScan(SCAN);
(function(){
 function _p(n){return String(n).padStart(2,'0');}
 var F=4*3600*1000;
 function tick(){var now=new Date();var c=document.getElementById('sc-clock');
   if(c)c.textContent=now.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})+' ET';
   var ms=now.getTime(),nxt=Math.ceil((ms+1)/F)*F,d=Math.max(0,Math.round((nxt-ms)/1000)),h=Math.floor(d/3600);d-=h*3600;var mm=Math.floor(d/60),s=d-mm*60;
   var cd=document.getElementById('sc-countdown');if(cd)cd.textContent=_p(h)+':'+_p(mm)+':'+_p(s);}
 setInterval(tick,1000);tick();
 var BUILD_TS=1786122183;
 var target=Math.ceil((Date.now()+1)/F)*F;
 setInterval(function(){var now=Date.now();if(now<target)return;
   fetch('build.json?t='+now,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(b){
     if(b&&b.ts&&b.ts>BUILD_TS){location.reload();}
     else if(now>target+25*60*1000){target=Math.ceil((Date.now()+1)/F)*F;}
   }).catch(function(){});
 },15000);
})();
</script></body></html>
