<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>4h MACD Scanner</title>
<style>
:root{color-scheme:light;--plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,0.10);--blue:#2a78d6;--orange:#eb6834;--good:#0ca30c;--good-text:#006300;--crit:#d03b3b;--warn:#fab219}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,0.10);--blue:#3987e5;--orange:#d95926;--good:#0ca30c;--good-text:#0ca30c;--crit:#e34948;--warn:#fab219}}
*{box-sizing:border-box}body{margin:0;background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding:24px 16px 56px}
.wrap{max-width:940px;margin:0 auto}.num{font-variant-numeric:tabular-nums}h1{font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ring);margin-bottom:6px;flex-wrap:wrap}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--blue)}.panel[hidden]{display:none}
.sub{color:var(--ink2);font-size:13px;max-width:620px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink);border:1px solid var(--ring)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:12px 0 6px}.asof{color:var(--muted);font-size:12px;text-align:right;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px 20px}
.hero{margin:14px 0;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}.hero .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:100%}
.hero .val{font-size:40px;font-weight:650;letter-spacing:-.02em}.hero .delta{font-size:16px;font-weight:600}
.up{color:var(--good-text)}.down{color:var(--crit)}.flat{color:var(--ink2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:14px 0}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:13px 15px}.tile .t{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.tile .v{font-size:21px;font-weight:620;letter-spacing:-.01em}.tile .v small{font-size:12px;font-weight:500;color:var(--ink2)}
.sec{margin:24px 0 10px;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.pos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px 18px}.prow{display:flex;justify-content:space-between;align-items:baseline}.sym{font-size:17px;font-weight:680}
.trbadge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:7px;background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pnl{font-size:15px;font-weight:640}.meta{color:var(--ink2);font-size:12.5px;margin-top:2px}
.bar{position:relative;height:8px;border-radius:6px;margin:22px 0 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--crit) 30%,var(--surface)),var(--grid),color-mix(in srgb,var(--good) 40%,var(--surface)))}
.bar .now{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.bar .avg{position:absolute;top:-3px;width:2px;height:14px;background:var(--muted);transform:translateX(-50%)}.bar .avg::after{content:"avg";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--muted)}
.barlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--grid)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.buy{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}.add{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.sell{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}.halfp{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.lng{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good-text)}.sht{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.note{color:var(--ink2)}
.callout{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,var(--ring));border-radius:12px;padding:14px 16px;font-size:13.5px;margin-top:14px}
.callout b{color:var(--ink)}.callout+.callout{margin-top:10px}.crit-callout{background:color-mix(in srgb,var(--crit) 10%,transparent);border-color:color-mix(in srgb,var(--crit) 35%,var(--ring))}
.foot{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.6}.chartwrap{position:relative}svg{display:block;width:100%;height:auto}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--plane);font-size:12px;padding:6px 9px;border-radius:7px;transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .08s}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}.kv .k{color:var(--muted)}.kv .v{text-align:right;font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center}
.costnote{font-size:11.5px;color:var(--ink2);background:rgba(120,120,120,.08);border:1px solid var(--ring);border-radius:8px;padding:6px 10px;margin:2px 0 10px;line-height:1.5}.costnote .cassume{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.topbar{position:sticky;top:8px;z-index:50;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:10px 16px;margin:0 0 12px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.topbar .tb-l{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;color:var(--ink)}
.topbar .dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.topbar .cd{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid var(--ring);border-radius:999px;background:var(--plane);font-size:13px;color:var(--ink2);white-space:nowrap}
.topbar .cd b{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:800;font-size:17px;letter-spacing:.02em}
.clockline{font-size:12px;color:var(--muted);margin:0 0 8px}.clockline #sc-clock{font-weight:600;color:var(--ink2)}</style></head><body><div class="wrap">
<div class="topbar"><span class="tb-l"><span class="dot"></span>🔍 4h MACD Scanner</span><span class="cd">Next 4h candle in <b id="sc-countdown">—:—:—</b></span></div>
<div class="clockline">🕒 <span id="sc-clock">—</span> · page auto-refreshes after each candle</div>
<div class="rhead"><div><div class="sub" id="sc-sub"></div></div><div style="text-align:right"><span class="badge" id="sc-badge">● Scanner</span><div class="asof" id="sc-asof"></div></div></div>
  <div class="tiles" id="sc-tiles"></div>
  <div class="callout" id="sc-explain"></div>
  <div class="sec">Matches — bullish MACD cross below the zero line (4h)</div>
  <div class="card" style="padding:6px 8px"><table id="sc-tbl"><thead><tr><th>Ticker</th><th>Index</th><th>Cross</th><th class="r">MACD</th><th class="r">Signal</th><th class="r">Hist</th><th class="r">Last</th><th class="r">Day</th><th class="r">Avg vol</th></tr></thead><tbody></tbody></table></div>
  <div class="foot" id="sc-foot"></div>
</div>

const SCAN={"meta":{"asOf":"Aug 6, 2026 \u00b7 10:17 PM ET \u2014 4h MACD, 5 fresh crosses","universe":516,"scanned":516,"hits":16},"rows":[{"macd":-2.815,"signal":-3.0228,"hist":0.2079,"bars_ago":0,"ticker":"TRGP","idx":["SP500"],"avg_vol":1169530,"last":268.39,"chg":3.18,"faded":false,"cross":"2026-08-06","name":"Targa Resources, Inc."},{"macd":-11.1282,"signal":-11.2244,"hist":0.0962,"bars_ago":0,"ticker":"CHRW","idx":["SP500"],"avg_vol":2512321,"last":146.66,"chg":-4.52,"faded":false,"cross":"2026-08-06","name":"C.H. Robinson Worldwide, Inc."},{"macd":-2.4997,"signal":-2.5889,"hist":0.0892,"bars_ago":0,"ticker":"BG","idx":["SP500"],"avg_vol":1392096,"last":108.99,"chg":2.22,"faded":false,"cross":"2026-08-06","name":"Bunge Limited"},{"macd":-10.9017,"signal":-10.9818,"hist":0.0801,"bars_ago":0,"ticker":"NXPI","idx":["NDX","SP500"],"avg_vol":4502076,"last":231.65,"chg":0.22,"faded":false,"cross":"2026-08-06","name":"NXP Semiconductors N.V."},{"macd":-1.3689,"signal":-1.3753,"hist":0.0064,"bars_ago":0,"ticker":"PNW","idx":["SP500"],"avg_vol":1247788,"last":100.84,"chg":-0.65,"faded":false,"cross":"2026-08-06","name":"Pinnacle West Capital Corporati"},{"macd":-4.6083,"signal":-7.401,"hist":2.7927,"bars_ago":1,"ticker":"LLY","idx":["SP500"],"avg_vol":2615789,"last":1192.8,"chg":1.96,"faded":false,"cross":"2026-08-06","name":"Eli Lilly and Company"},{"macd":-1.2491,"signal":-1.9776,"hist":0.7285,"bars_ago":1,"ticker":"LHX","idx":["SP500"],"avg_vol":1511883,"last":289.53,"chg":1.19,"faded":false,"cross":"2026-08-06","name":"L3Harris Technologies, Inc."},{"macd":-1.862,"signal":-2.3617,"hist":0.4997,"bars_ago":1,"ticker":"TMUS","idx":["NDX","SP500"],"avg_vol":4952003,"last":179.99,"chg":3.76,"faded":false,"cross":"2026-08-06","name":"T-Mobile US, Inc."},{"macd":-6.7455,"signal":-7.1891,"hist":0.4436,"bars_ago":1,"ticker":"LIN","idx":["NDX","SP500"],"avg_vol":2168989,"last":490.25,"chg":-0.16,"faded":false,"cross":"2026-08-06","name":"Linde plc"},{"macd":-0.5485,"signal" function renderScan(SC){const rows=SC.rows,m=SC.meta;
document.getElementById('sc-sub').innerHTML='Bullish <b>MACD(12,26,9)</b> cross on <b>4-hour</b> bars while the MACD line is <b>below zero</b> — the classic oversold-and-turning-up trigger. Universe: <b>S&amp;P 500 + Nasdaq-100 + Dow</b>, filtered to <b>avg volume ≥ 1M</b> shares/day.';
document.getElementById('sc-asof').textContent=m.asOf;
const inSP=rows.filter(r=>r.idx.includes('SP500')).length,inND=rows.filter(r=>r.idx.includes('NDX')).length,inDW=rows.filter(r=>r.idx.includes('DOW')).length,fresh=rows.filter(r=>r.bars_ago===0).length;
document.getElementById('sc-tiles').innerHTML=[['Matches',rows.length],['Crossed this bar',fresh],['In S&P 500',inSP],['In Nasdaq-100',inND],['In Dow',inDW],['Universe scanned',m.scanned]].map(t=>`<div class="tile"><div class="t">${t[0]}</div><div class="v num">${t[1]}</div></div>`).join('');
document.getElementById('sc-explain').innerHTML='<b>How to read this.</b> Each name below had its 4-hour MACD line cross up through its signal line while still under zero — momentum turning up from an oversold/pullback state. Freshest crosses are listed first, then by histogram strength (how decisively the lines separated). MACD is computed on Robinhood\'s 4-hour bars, through the last completed 4h bar. <b>This is a watchlist signal, not a trade</b> — nothing here is bought. A negative day-change on a fresh cross (e.g. a gap-down after the cross printed) means the setup may already be invalidated — check the chart before acting.';
const idxpill=a=>a.map(x=>{const lab=x==='SP500'?'S&P':x==='NDX'?'NDX':'DOW';const cl=x==='DOW'?'add':x==='NDX'?'buy':'halfp';return `<span class="pill ${cl}" style="margin-right:3px">${lab}</span>`;}).join('');
const crosspill=r=>{const lab=r.bars_ago===0?'This bar':r.bars_ago+' bar'+(r.bars_ago>1?'s':'')+' ago';const cl=r.bars_ago===0?'halfp':r.bars_ago===1?'buy':'add';const d=new Date(r.cross+'T00:00:00');const ds=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});return `<span class="pill ${cl}">${lab}</span> <span class="note" style="font-size:11px">${ds}</span>`;};
const fmtvol=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?0:1)+'M':(v/1e3).toFixed(0)+'k';
const fmtpx=p=>p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tb=document.querySelector('#sc-tbl tbody');
tb.innerHTML=rows.map(r=>{const chgc=r.chg>=0?'up':'down';const hc=r.hist>=0?'var(--good-text)':'var(--crit)';
return `<tr><td><span class="sym" style="font-size:14px">${r.ticker}</span>${r.faded?' <span class="pill sell" style="font-size:9.5px">faded</span>':''}<div class="meta">${r.name}</div></td><td>${idxpill(r.idx)}</td><td>${crosspill(r)}</td><td class="r num">${r.macd.toFixed(2)}</td><td class="r num">${r.signal.toFixed(2)}</td><td class="r num" style="color:${hc};font-weight:640">${r.hist>=0?'+':''}${r.hist.toFixed(2)}</td><td class="r num">$${fmtpx(r.last)}</td><td class="r num ${chgc}">${r.chg>=0?'+':''}${r.chg.toFixed(1)}%</td><td class="r num note">${fmtvol(r.avg_vol)}</td></tr>`;}).join('');
document.getElementById('sc-foot').innerHTML='Signal: MACD(12,26,9) on 4h bars, bullish line/signal cross with MACD &lt; 0, cross within the last 3 bars. Filter: avg daily volume ≥ 1,000,000 shares; universe = current S&amp;P 500 + Nasdaq-100 + Dow 30 members ('+m.universe+' unique). Index membership from public constituent lists (may drift slightly between reconstitutions). Day-change vs prior close; prices intraday. Re-runs on every "update". <b>Watchlist only — no orders are placed.</b>';}
renderScan(SCAN);
(function(){
 function _p(n){return String(n).padStart(2,'0');}
 var F=4*3600*1000; // 4h in ms; UTC-aligned candle boundaries (…12:00,16:00,20:00 UTC)
 function tick(){var now=new Date();
   var c=document.getElementById('sc-clock');
   if(c)c.textContent=now.toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})+' ET';
   var ms=now.getTime(), nxt=Math.ceil((ms+1)/F)*F, d=Math.max(0,Math.round((nxt-ms)/1000));
   var h=Math.floor(d/3600); d-=h*3600; var m=Math.floor(d/60), s=d-m*60;
   var cd=document.getElementById('sc-countdown'); if(cd)cd.textContent=_p(h)+':'+_p(m)+':'+_p(s);
 }
 setInterval(tick,1000); tick();
 // live update: after each candle closes, poll for the freshly published scan and reload the instant it lands
 var BUILD_TS=1786069073;
 var target=Math.ceil((Date.now()+1)/F)*F;
 setInterval(function(){
   var now=Date.now();
   if(now<target) return;               // candle hasn't closed yet
   fetch('build.json?t='+now,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(b){
     if(b&&b.ts&&b.ts>BUILD_TS){location.reload();}                       // new scan published -> reload now
     else if(now>target+25*60*1000){target=Math.ceil((Date.now()+1)/F)*F;} // give up this candle, wait for next
   }).catch(function(){});
 },30000);
})();
